name: Daily Paper Trading

on:
  schedule:
    - cron: '5 0 * * *'  # Esegue ogni giorno alle 00:05 UTC
  workflow_dispatch:  # Permette esecuzione manuale

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Scarica tutta la storia Git
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Paper Trading
      run: python paper_trading.py
    
    - name: Commit and push results
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # Forza pull prima di commit per avere l'ultima versione
        git pull origin main --rebase || true
        
        git add paper_trading_log.csv
        
        # Verifica se ci sono cambiamenti
        if git diff --staged --quiet; then
          echo "Nessun cambiamento da committare"
        else
          git commit -m "Update paper trading log [skip ci]"
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
