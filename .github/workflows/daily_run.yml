name: Daily Paper Trading

on:
  schedule:
    # Esegue ogni giorno alle 00:05 UTC (circa 01:05 o 02:05 in Italia)
    - cron: '5 0 * * *'
  workflow_dispatch:  # Permette esecuzione manuale

jobs:
  track:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Paper Trading
      run: python paper_trading.py
    
    - name: Commit and push results
      run: |
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        git add paper_trading_log.csv
        git commit -m "Update paper trading log [skip ci]" || echo "No changes"
        git push
